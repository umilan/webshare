<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebShare</title>
<meta name="description" content="Share your camera or screen and watch it in any browser – no app needed.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📡</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root { --bg:#0f1115; --panel:#181b22; --line:#2a2f3a; --text:#e8eaf0; --muted:#9aa3b2; --accent:#4f8cff; --bad:#ff5c5c; }
* { box-sizing:border-box; }
html, body { margin:0; min-height:100%; background:var(--bg); color:var(--text); font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
button, select { font:inherit; color:var(--text); background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:9px 14px; cursor:pointer; }
button:hover { border-color:var(--accent); }
button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
button.danger { background:var(--bad); border-color:var(--bad); color:#fff; font-weight:600; }
input[type=text] { font:inherit; color:var(--text); background:#0b0d11; border:1px solid var(--line); border-radius:8px; padding:9px 12px; width:9em; text-transform:uppercase; letter-spacing:.1em; }
/* sharer: top bar + centered preview */
#home { display:flex; flex-direction:column; height:100vh; height:100dvh; }
#topbar { display:flex; flex-wrap:wrap; gap:6px; align-items:center; padding:8px 12px; background:var(--panel); border-bottom:1px solid var(--line); position:relative; z-index:2; }
#topbar button, #topbar select { padding:6px 10px; font-size:14px; }
#topbar .brand { font-weight:700; margin-right:4px; white-space:nowrap; }
#topbar .sep { width:1px; align-self:stretch; background:var(--line); margin:0 4px; }
#topbar .code { font-weight:800; letter-spacing:.12em; font-size:16px; }
.muted { color:var(--muted); }
.pill { display:inline-block; padding:1px 8px; border-radius:999px; font-size:12px; border:1px solid var(--line); }
.pill.live { background:var(--bad); border-color:var(--bad); color:#fff; font-weight:700; }
#stage { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; padding:16px; }
#previewWrap { position:relative; display:flex; max-width:100%; max-height:100%; min-height:0; }
#preview { max-width:100%; max-height:100%; min-height:0; background:#000; border-radius:12px; box-shadow:0 10px 40px rgba(0,0,0,.5); }
#status { position:absolute; top:10px; left:10px; padding:2px 8px; font-size:11px; letter-spacing:.06em; background:rgba(0,0,0,.6); border-color:transparent; color:#fff; backdrop-filter:blur(4px); pointer-events:none; }
#status.live { background:var(--bad); }
#status.live::before { content:''; display:inline-block; width:6px; height:6px; border-radius:50%; background:#fff; margin-right:5px; vertical-align:1px; animation:blink 1.4s infinite; }
@keyframes blink { 50% { opacity:.25; } }
#idle { text-align:center; color:var(--muted); }
#idle .row { display:flex; gap:8px; justify-content:center; margin-top:12px; }
#qrModal { position:fixed; inset:0; z-index:10; background:rgba(8,9,12,.94); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; padding:20px; }
#qr { background:#fff; padding:16px; border-radius:16px; width:min(86vw, 62vh, 560px); }
#qr img, #qr canvas { display:block; width:100% !important; height:auto !important; image-rendering:pixelated; }
#qrCode { font-size:28px; font-weight:800; letter-spacing:.15em; }
#link { max-width:min(92vw, 640px); text-align:center; font-size:16px; word-break:break-all; color:var(--text); background:#0b0d11; border:1px solid var(--line); border-radius:10px; padding:10px 14px; user-select:all; }
#qrModal .row { display:flex; gap:10px; }
#qrModal button { padding:12px 22px; font-size:16px; }
.spacer { flex:1; }
.seg { display:inline-flex; background:#0b0d11; border:1px solid var(--line); border-radius:9px; padding:2px; gap:2px; }
#topbar .seg button { border:0; background:transparent; padding:5px 10px; border-radius:7px; color:var(--muted); display:flex; }
#topbar .seg button[aria-checked=true] { background:var(--accent); color:#fff; }
.seg svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
#topbar .seg button.off { opacity:.4; }
#toast { position:fixed; left:50%; top:72px; transform:translateX(-50%); z-index:20; width:max-content; max-width:min(92vw, 480px); background:#2a2f3a; color:var(--text); border:1px solid var(--line); border-radius:12px; padding:12px 16px; box-shadow:0 10px 30px rgba(0,0,0,.5); font-size:14px; }
#footer { text-align:center; font-size:11px; color:var(--muted); opacity:.7; padding:4px 0 6px; }
#linkCard { display:inline-flex; gap:6px; align-items:center; }
@media (max-width:640px) {
  .wide { display:none; }
  #topbar { gap:4px; padding:6px 8px; }
  #topbar button, #topbar select { padding:5px 7px; font-size:13px; }
  
  #stage { padding:8px; }
}
/* viewer */
#viewer { position:fixed; inset:0; background:#000; display:flex; align-items:center; justify-content:center; }
#viewer video { width:100%; height:100%; object-fit:contain; }
#vmsg { position:absolute; text-align:center; color:var(--muted); padding:20px; }
#bar { position:fixed; left:0; right:0; bottom:0; padding:12px 16px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; background:linear-gradient(transparent,rgba(0,0,0,.8)); transition:opacity .3s; }
#bar.hide { opacity:0; pointer-events:none; }
[hidden] { display:none !important; }
</style>
</head>
<body>

<!-- ============ HOME / SHARE ============ -->
<div id="home" hidden>
  <div id="topbar">
    <span class="brand">📡<span class="wide"> WebShare</span></span>
    <span class="sep wide"></span>
    <div id="source" class="seg" role="radiogroup" aria-label="Source">
      <button type="button" data-v="screen" role="radio" aria-checked="true" title="Screen" aria-label="Screen">
        <svg viewBox="0 0 24 24"><rect x="2.5" y="4" width="19" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg></button>
      <button type="button" data-v="camera" role="radio" aria-checked="false" title="Camera" aria-label="Camera">
        <svg viewBox="0 0 24 24"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.8l1.4-2h6.6l1.4 2h1.8A2.5 2.5 0 0 1 21 8.5v9a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/><circle cx="12" cy="12.5" r="3.6"/></svg></button>
    </div>
    <select id="camera" hidden title="Camera"></select>
    <select id="quality" title="Quality">
      <option value="480">480</option>
      <option value="720">720</option>
      <option value="1080" selected>1080</option>
    </select>
    <label class="muted" title="Share audio"><input type="checkbox" id="audio"> 🔊</label>
    <button id="start" class="primary">Start</button>
    <button id="stop" class="danger" hidden>Stop</button>
    <span class="spacer"></span>
    <span id="linkCard" hidden>
      <span class="muted wide">Code</span> <span id="code" class="code"></span>
      <button id="qrBtn" class="primary" title="Share watch link (QR, copy)">Share</button>
      <span class="muted" title="Viewers">👁 <b id="count">0</b></span>
    </span>
  </div>
  <div id="toast" hidden role="status"></div>
  <div id="qrModal" hidden role="dialog" aria-modal="true" aria-label="Watch link QR code">
    <div id="qrCode"></div>
    <div id="qr"></div>
    <div id="link"></div>
    <div class="row">
      <button id="qrCopy" class="primary">Copy link</button>
      <button id="qrShare" hidden>Share…</button>
      <button id="qrClose">Close</button>
    </div>
  </div>
  <div id="stage">
    <div id="previewWrap" hidden>
      <video id="preview" autoplay muted playsinline></video>
      <span id="status" class="pill">connecting…</span>
    </div>
    <div id="idle">
      <div style="font-size:42px">📡</div>
      <span id="hint">Choose <b>Screen</b> or <b>Camera</b> above and press <b>Start</b>.</span>
      <div class="row">
        <input id="joinCode" type="text" placeholder="CODE" maxlength="12" autocomplete="off">
        <button id="join">Watch</button>
      </div>
    </div>
  </div>
<footer id="footer">WebShare <span class="ver"></span></footer>
</div>

<!-- ============ VIEWER ============ -->
<div id="viewer" hidden>
  <video id="video" autoplay muted playsinline></video>
  <div id="vmsg">Connecting…</div>
  <div id="bar">
    <span id="vstatus" class="pill">connecting</span>
    <span id="vcode" class="muted"></span>
    <span class="muted ver" style="font-size:11px;opacity:.7"></span>
    <span class="spacer"></span>
    <button id="unmute" hidden>🔊 Unmute</button>
    <button id="fs">⛶ Fullscreen</button>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const APP_VERSION = '1.8.0'; // bump on every published change
const PREFIX = 'webshare-v1-';
const ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const randomCode = () => Array.from(crypto.getRandomValues(new Uint8Array(6)), b => ALPHABET[b % ALPHABET.length]).join('');
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const pill = (el, text, live) => { el.textContent = text; el.className = 'pill' + (live ? ' live' : ''); };
let toastT;
function toast(text) { const t = $('toast'); t.textContent = text; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 5000); }
const watchUrl = (code) => `${location.origin}${location.pathname}?watch=${code}`;

document.querySelectorAll('.ver').forEach(e => e.textContent = 'v' + APP_VERSION);
const watchCode = (new URLSearchParams(location.search).get('watch') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
if (watchCode) startViewer(watchCode); else startHome();

// =====================================================================
// SHARER
// =====================================================================
function startHome() {
  $('home').hidden = false;
  let stream = null, peer = null, code = store.get('webshare-code') || randomCode();
  const conns = new Map(); // viewerPeerId -> { conn, call }

  let source = 'screen';
  function setSource(v) {
    source = v;
    $('source').querySelectorAll('button').forEach(b => b.setAttribute('aria-checked', b.dataset.v === v));
    $('camera').hidden = v !== 'camera';
    if (v === 'camera') listCameras();
  }
  let screenUnsupported = false;
  $('source').querySelectorAll('button').forEach(b => b.onclick = () => {
    if (b.dataset.v === 'screen' && screenUnsupported)
      return toast('Phone browsers can\'t share the screen – Apple and Google block it. Open this page on a computer to share its screen, or use the camera here.');
    setSource(b.dataset.v);
  });
  // phones/tablets can't share the screen (iOS even exposes getDisplayMedia but it always fails)
  const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (isMobile || !navigator.mediaDevices?.getDisplayMedia) {
    screenUnsupported = true;
    $('source').querySelector('[data-v=screen]').classList.add('off');
    $('hint').innerHTML = 'Pick <b>Front</b> or <b>Rear</b> camera and press <b>Start</b>.';
    setSource('camera');
  }

  async function listCameras() {
    try {
      const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
      const cur = $('camera').value;
      // short labels: "Front" / "Rear" (no "camera" word); e.g. iPhone "Back Ultra Wide Camera" -> "Rear Ultra Wide"
      const short = (l, i) => (l || `Cam ${i + 1}`).replace(/^.*facing (front|back).*$/i, '$1').replace(/\s*\(.*?\)/g, '').replace(/\bcamera\b/ig, '').replace(/\bback\b/ig, 'Rear').replace(/\s+/g, ' ').trim() || `Cam ${i + 1}`;
      const extra = devs.filter(d => d.deviceId).map((d, i) => [d.deviceId, short(d.label, i)]).filter(([, l]) => !/^(front|rear)$/i.test(l));
      $('camera').innerHTML = '<option value="user">Front</option><option value="environment">Rear</option>'
        + extra.map(([id, l]) => `<option value="${id}">${l}</option>`).join('');
      if (cur) $('camera').value = cur;
    } catch (e) {}
  }

  async function capture() {
    const h = +$('quality').value, audio = $('audio').checked;
    if (source === 'screen')
      return navigator.mediaDevices.getDisplayMedia({ video: { height: { ideal: h }, frameRate: { ideal: 30 } }, audio });
    const cam = $('camera').value || 'user';
    const video = { height: { ideal: h } };
    if (cam === 'user' || cam === 'environment') video.facingMode = cam; else video.deviceId = { exact: cam };
    const s = await navigator.mediaDevices.getUserMedia({ video, audio });
    listCameras();
    return s;
  }

  async function start() {
    let s;
    try { s = await capture(); } catch (e) { if (e.name !== 'NotAllowedError') alert(e.message || e); return; }
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = s;
    $('preview').srcObject = stream; $('previewWrap').hidden = false; $('idle').hidden = true;
    stream.getVideoTracks()[0].onended = stop;
    $('start').textContent = 'Switch'; $('stop').hidden = false;
    if (!peer) openPeer();
    else for (const id of conns.keys()) callViewer(id); // re-send new stream
  }

  function stop() {
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = null; $('preview').srcObject = null; $('previewWrap').hidden = true; pill($('status'), 'connecting…'); $('idle').hidden = false; $('qrModal').hidden = true;
    for (const { conn, call } of conns.values()) { call?.close(); conn.close(); }
    conns.clear(); updateCount();
    if (peer) { peer.destroy(); peer = null; }
    $('start').textContent = 'Start'; $('stop').hidden = true; $('linkCard').hidden = true;
  }

  function openPeer() {
    pill($('status'), 'connecting…');
    peer = new Peer(PREFIX + code);
    peer.on('open', () => {
      store.set('webshare-code', code);
      pill($('status'), 'LIVE', true);
      showLink();
    });
    peer.on('connection', (conn) => {
      conn.on('open', () => { conns.set(conn.peer, { conn, call: null }); callViewer(conn.peer); updateCount(); });
      conn.on('close', () => { conns.get(conn.peer)?.call?.close(); conns.delete(conn.peer); updateCount(); });
    });
    peer.on('disconnected', () => { if (peer && !peer.destroyed) { pill($('status'), 'reconnecting…'); setTimeout(() => peer && !peer.destroyed && peer.reconnect(), 1500); } });
    peer.on('error', (err) => {
      if (err.type === 'unavailable-id') { // code taken (e.g. open in another tab) -> new code
        peer.destroy(); code = randomCode(); openPeer();
      } else if (['network', 'server-error', 'socket-error', 'socket-closed'].includes(err.type)) {
        pill($('status'), 'reconnecting…');
      } else console.warn(err);
    });
  }

  function callViewer(id) {
    const entry = conns.get(id); if (!entry || !stream) return;
    entry.call?.close();
    entry.call = peer.call(id, stream);
  }

  function updateCount() { $('count').textContent = conns.size; }

  function showLink() {
    $('code').textContent = code;
    $('link').textContent = watchUrl(code);
    $('qrCode').textContent = code;
    $('qr').innerHTML = '';
    if (window.QRCode) new QRCode($('qr'), { text: watchUrl(code), width: 512, height: 512, correctLevel: QRCode.CorrectLevel.M });
    $('linkCard').hidden = false;
  }

  $('start').onclick = start;
  $('stop').onclick = stop;
  async function copyLink(btn, label) {
    const url = watchUrl(code);
    try { await navigator.clipboard.writeText(url); }
    catch (e) { // fallback for browsers without async clipboard
      const t = document.createElement('textarea'); t.value = url; document.body.appendChild(t); t.select();
      document.execCommand('copy'); t.remove();
    }
    btn.textContent = '✓ Copied'; setTimeout(() => btn.textContent = label, 1500);
  }
  if (navigator.share) { // native share sheet (Messages, WhatsApp, Mail…)
    $('qrShare').hidden = false;
    $('qrShare').onclick = () => navigator.share({ title: 'WebShare', text: `Watch my stream (code ${code})`, url: watchUrl(code) }).catch(() => {});
  }
  $('qrCopy').onclick = () => copyLink($('qrCopy'), 'Copy link');
  $('qrBtn').onclick = () => { $('qrModal').hidden = false; };
  $('qrClose').onclick = () => { $('qrModal').hidden = true; };
  $('qrModal').onclick = (e) => { if (e.target === $('qrModal')) $('qrModal').hidden = true; };
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') $('qrModal').hidden = true; });
  const join = () => { const c = $('joinCode').value.toUpperCase().replace(/[^A-Z0-9]/g, ''); if (c) location.href = watchUrl(c); };
  $('join').onclick = join;
  $('joinCode').onkeydown = (e) => { if (e.key === 'Enter') join(); };
}

// =====================================================================
// VIEWER
// =====================================================================
function startViewer(code) {
  $('viewer').hidden = false;
  $('vcode').textContent = code;
  document.title = `WebShare – ${code}`;
  const video = $('video');
  const msg = (t) => { $('vmsg').innerHTML = t; $('vmsg').hidden = !t; };
  let peer, conn, retry;

  function waiting() {
    video.srcObject = null; pill($('vstatus'), 'waiting');
    msg(`Waiting for <b>${code}</b> to start sharing…`);
    clearTimeout(retry); retry = setTimeout(connect, 3000);
  }

  function connect() {
    if (!peer || peer.destroyed || peer.disconnected) return;
    conn?.close();
    conn = peer.connect(PREFIX + code, { reliable: true });
    conn.on('open', () => { pill($('vstatus'), 'connecting'); msg('Connecting…'); });
    conn.on('close', waiting);
  }

  peer = new Peer();
  peer.on('open', connect);
  peer.on('call', (call) => {
    call.answer();
    call.on('stream', (s) => {
      video.srcObject = s;
      $('unmute').hidden = !s.getAudioTracks().length || !video.muted;
      video.play().catch(() => {});
    });
  });
  peer.on('error', (err) => {
    if (err.type === 'peer-unavailable') waiting();
    else if (['network', 'server-error', 'socket-error', 'socket-closed'].includes(err.type)) { msg('Network problem – retrying…'); }
    else console.warn(err);
  });
  peer.on('disconnected', () => setTimeout(() => { if (!peer.destroyed) peer.reconnect(); }, 2000));

  video.addEventListener('playing', () => { msg(''); pill($('vstatus'), 'LIVE', true); });

  $('unmute').onclick = () => { video.muted = false; video.play(); $('unmute').hidden = true; };
  $('fs').onclick = () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
    else if (video.webkitEnterFullscreen) video.webkitEnterFullscreen();
  };
  let hideT;
  const poke = () => { $('bar').classList.remove('hide'); clearTimeout(hideT); hideT = setTimeout(() => $('bar').classList.add('hide'), 3000); };
  ['mousemove', 'touchstart', 'keydown'].forEach(e => document.addEventListener(e, poke));
  poke();
}
</script>
</body>
</html>
