<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebShare – Watch</title>
<link rel="stylesheet" href="/style.css">
<style>
  body { overflow:hidden; }
  #stage { position:fixed; inset:0; background:#000; display:flex; align-items:center; justify-content:center; }
  #video, #mjpeg { width:100%; height:100%; object-fit:contain; }
  #msg { position:absolute; text-align:center; color:var(--muted); padding:20px; }
  #bar { position:fixed; left:0; right:0; bottom:0; padding:12px 16px; display:flex; gap:8px; align-items:center; flex-wrap:wrap;
         background:linear-gradient(transparent, rgba(0,0,0,.8)); transition:opacity .3s; }
  #bar.hide { opacity:0; pointer-events:none; }
  #bar .spacer { flex:1; }
</style>
</head>
<body>
<div id="stage">
  <video id="video" autoplay muted playsinline></video>
  <img id="mjpeg" alt="" hidden>
  <div id="msg">Waiting for someone to start sharing…<br><small>Open <b>/share</b> on the sharing device.</small></div>
</div>
<div id="bar">
  <span id="status" class="pill">connecting</span>
  <span id="mode" class="muted"></span>
  <span class="spacer"></span>
  <button id="unmute" hidden>🔊 Unmute</button>
  <button id="switch">Use MJPEG</button>
  <button id="fs">⛶ Fullscreen</button>
</div>

<script>
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
const room = params.get('room') || 'main';
const ICE = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
const video = $('video'), img = $('mjpeg');

let mode = params.get('mode') === 'mjpeg' || !window.RTCPeerConnection ? 'mjpeg' : 'webrtc';
let es = null, myId = null, pc = null, chain = Promise.resolve(), fallbackTimer = null, live = false;

function setStatus(text, isLive) { $('status').textContent = text; $('status').className = 'pill' + (isLive ? ' live' : ''); }
function showMsg(html) { $('msg').innerHTML = html; $('msg').hidden = !html; }
function waiting() { showMsg('Waiting for someone to start sharing…<br><small>Open <b>/share</b> on the sharing device.</small>'); }

// ---------- signaling (always connected, so we know when the sharer is live)
function connect() {
  es = new EventSource(`/events?role=viewer&rtc=${mode === 'webrtc' ? 1 : 0}&room=${encodeURIComponent(room)}`);
  es.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    if (m.type === 'hello') { myId = m.id; setLive(m.live); }
    else if (m.type === 'broadcaster-ready') setLive(true);
    else if (m.type === 'broadcaster-left') setLive(false);
    else if (m.type === 'signal') onSignal(m.from, m.data);
  };
  es.onerror = () => setStatus('reconnecting…');
}

function setLive(on) {
  live = on;
  if (!on) {
    closePc(); stopMjpeg(); waiting(); setStatus('offline'); return;
  }
  setStatus('LIVE', true);
  if (mode === 'mjpeg') startMjpeg();
  else armFallback();
}

// If WebRTC has not produced video within 10 s, fall back to MJPEG automatically.
function armFallback() {
  clearTimeout(fallbackTimer);
  showMsg('Connecting…');
  fallbackTimer = setTimeout(() => {
    if (mode === 'webrtc' && live && !(video.srcObject && video.videoWidth)) { console.warn('WebRTC timeout, using MJPEG'); setMode('mjpeg'); }
  }, 10000);
}

function closePc() { if (pc) { pc.close(); pc = null; } video.srcObject = null; }

function onSignal(from, data) {
  if (mode !== 'webrtc') return;
  chain = chain.then(async () => {
    if (data.sdp && data.sdp.type === 'offer') {
      closePc();
      pc = new RTCPeerConnection(ICE);
      pc.onicecandidate = (e) => { if (e.candidate) signal(from, { candidate: e.candidate }); };
      pc.ontrack = (e) => {
        video.srcObject = e.streams[0];
        $('unmute').hidden = !e.streams[0].getAudioTracks().length || !video.muted;
        video.play().catch(() => {});
      };
      pc.onconnectionstatechange = () => { if (pc && pc.connectionState === 'failed' && live) setMode('mjpeg'); };
      await pc.setRemoteDescription(data.sdp);
      await pc.setLocalDescription(await pc.createAnswer());
      signal(from, { sdp: pc.localDescription });
    } else if (data.candidate && pc) {
      await pc.addIceCandidate(data.candidate);
    }
  }).catch(e => console.warn(e));
}

function signal(to, data) {
  return fetch(`/signal?room=${encodeURIComponent(room)}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ from: myId, to, data }) });
}

video.addEventListener('playing', () => { if (mode === 'webrtc') showMsg(''); });

// ---------- MJPEG
function startMjpeg() {
  video.hidden = true; img.hidden = false;
  img.src = `/stream.mjpg?room=${encodeURIComponent(room)}&t=${Date.now()}`;
  showMsg('');
}
function stopMjpeg() { img.removeAttribute('src'); img.hidden = true; video.hidden = false; }
img.onerror = () => { if (mode === 'mjpeg' && live) setTimeout(startMjpeg, 2000); };

function setMode(m) {
  mode = m;
  $('switch').textContent = m === 'webrtc' ? 'Use MJPEG' : 'Use WebRTC';
  $('mode').textContent = m === 'webrtc' ? 'WebRTC (low latency)' : 'MJPEG (compatibility)';
  closePc(); stopMjpeg(); clearTimeout(fallbackTimer);
  // reconnect so the sharer knows whether to send us a WebRTC offer
  if (es) es.close();
  connect();
}

// ---------- controls
$('switch').onclick = () => setMode(mode === 'webrtc' ? 'mjpeg' : 'webrtc');
$('unmute').onclick = () => { video.muted = false; video.play(); $('unmute').hidden = true; };
$('fs').onclick = () => {
  const el = document.documentElement;
  if (document.fullscreenElement) document.exitFullscreen();
  else if (el.requestFullscreen) el.requestFullscreen();
  else if (video.webkitEnterFullscreen) video.webkitEnterFullscreen(); // iOS
};
let hideT;
function poke() { $('bar').classList.remove('hide'); clearTimeout(hideT); hideT = setTimeout(() => $('bar').classList.add('hide'), 3000); }
['mousemove', 'touchstart', 'keydown'].forEach(e => document.addEventListener(e, poke));
poke();

$('switch').textContent = mode === 'webrtc' ? 'Use MJPEG' : 'Use WebRTC';
$('mode').textContent = mode === 'webrtc' ? 'WebRTC (low latency)' : 'MJPEG (compatibility)';
connect();
</script>
</body>
</html>
